    <main class="hero">
        <h1>Interactive Sketchbook</h1>
        <h2>by Diya Tamrakar</h2>

    <div class="sky">
        <div class="cloud c1"></div> <div class="cloud c2"></div>
        <div class="cloud c3"></div> <div class="cloud c4"></div>
        <div class="cloud c5"></div> <div class="cloud c6"></div>
        <div class="cloud c7"></div> <div class="cloud c8"></div>
        <div class="cloud c9"></div> <div class="cloud c10"></div>
        <div class="cloud c11"></div> <div class="cloud c12"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const mainNav = document.querySelector('.main-nav');
            const dropButtons = document.querySelectorAll('.dropbtn');
            
            // 1. Toggle Side Drawer Pop-Out Panel Open/Closed
            menuToggle.addEventListener('click', function(e) {
                mainNav.classList.toggle('nav-open');
                e.stopPropagation(); 
            });
            
            // 2. Control internal sub-menus inside the open mobile panel
            dropButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        const targetMenu = this.parentElement;
                        
                        // Close any other open sub-menus first
                        document.querySelectorAll('.dropdown').forEach(item => {
                            if (item !== targetMenu) {
                                item.classList.remove('js-active');
                            }
                        });
                        
                        targetMenu.classList.toggle('js-active');
                        e.stopPropagation();
                    }
                });
            });

            // 3. Close the drawer if a user clicks outside the menu context window completely
            document.addEventListener('click', function(e) {
                const menuItemsPanel = document.querySelector('.menu-items');
                if (mainNav.classList.contains('nav-open') && !menuItemsPanel.contains(e.target) && e.target !== menuToggle) {
                    mainNav.classList.remove('nav-open');
                    document.querySelectorAll('.dropdown').forEach(item => {
                        item.classList.remove('js-active');
                    });
                }
            });
        });
    </script>
</body>
